[project]
name = "youtube-monitor"
version = "0.1.0"
description = "TUI for browsing YouTube subscriptions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.187.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth-oauthlib>=1.2.3",
    "pillow>=12.2.0",
]

[project.scripts]
youtube-monitor = "youtube_monitor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_monitor"]
